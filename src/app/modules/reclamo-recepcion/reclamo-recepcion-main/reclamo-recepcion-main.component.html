<div id="wrapper">
  <app-sidebar-admin></app-sidebar-admin>
  <div id="content-wrapper" class="d-flex flex-column">
    <div id="content">
      <app-topbar-admin></app-topbar-admin>
      <div class="container-fluid">
        <div class="card shadow mb-4">
          <div class="card-header py-3 bg-success">
            <h5 class="m-0 font-weight-bold text-white title">Módulo para admitir los reclamos, quejas o sugerencias</h5>
          </div>

          <div class="card-body">
            <div class="row align-items-end">
              <!-- Filtro por Número de Expediente -->
              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Filtro Nº de Expediente:</mat-label>
                  <input
                    matInput
                    [(ngModel)]="filtro.codigoExpediente"
                    placeholder="Ingrese Nº de expediente..."
                  />
                </mat-form-field>
              </div>

              <!-- Filtro por Procedencia -->
              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Seleccione Procedencia</mat-label>
                  <mat-select [(ngModel)]="filtro.tipoCanalId">
                    <mat-option *ngFor="let item of tipoProcedencia" [value]="item.id">
                      {{ item.descripcion }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <!-- Filtro por Tipo de Reclamo -->
              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Seleccione Tipo de Reclamo</mat-label>
                  <mat-select [(ngModel)]="filtro.tipoReclamoId">
                    <mat-option *ngFor="let item of tipoReclamos" [value]="item.id">
                      {{ item.descripcion }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Seleccione Proyecto</mat-label>
                  <mat-select [(ngModel)]="filtro.tipoProyectoId">
                    <mat-option *ngFor="let item of tipoProyectos" [value]="item.id">
                      {{ item.descripcion }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <!-- Botones -->
              <div class="botones-acciones col-md-4 d-flex justify-content-end gap-2">
                <button class="btn-buscar" (click)="buscarConFiltros()">
                  <i class="bi bi-search"></i> Buscar
                </button>
                <button class="btn-resetear" (click)="limpiarFiltros()">
                  <i class="bi bi-trash"></i> Limpiar
                </button>
                <button class="btn-descargar">
                  <i class="bi bi-download"></i> Descargar
                </button>
              </div>
            </div>

            <nav>
              <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-por-atender" type="button" role="tab" aria-controls="nav-home" aria-selected="true">
                  <i class="bi bi-file-earmark-text text-primary"></i>
                  Por admitir</button>
                <button class="nav-link"
                        id="nav-profile-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#nav-atendido"
                        type="button"
                        role="tab"
                        aria-controls="nav-profile"
                        aria-selected="false"
                        (click)="activarPestania('atendido')">
                  <i class="bi bi-file-earmark-text text-warning"></i>
                  Admitidos
                </button>

                <!-- Denegados -->
                <button class="nav-link"
                        id="nav-contact-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#nav-denegado"
                        type="button"
                        role="tab"
                        aria-controls="nav-contact"
                        aria-selected="false"
                        (click)="activarPestania('denegado')">
                  <i class="bi bi-x-circle-fill text-danger"></i>
                  Denegados
                </button>
              </div>
            </nav>
            <div class="tab-content" id="nav-tabContent">
              <div class="tab-pane fade show active" id="nav-por-atender" role="tabpanel" aria-labelledby="nav-home-tab" tabindex="0">
                <br>
                <app-reclamo-recepcion-pendiente #reclamoPendiente (cambiarPestania)="activarPestania($event)"></app-reclamo-recepcion-pendiente>
              </div>
              <div class="tab-pane fade" id="nav-atendido" role="tabpanel" aria-labelledby="nav-profile-tab" tabindex="0">
                <br>
                <app-reclamo-recepcion-atendido #reclamoAtendido></app-reclamo-recepcion-atendido>
              </div>
              <div class="tab-pane fade" id="nav-denegado" role="tabpanel" aria-labelledby="nav-contact-tab" tabindex="0">
                <br>
                <app-reclamo-recepcion-denegado #reclamoDenegado></app-reclamo-recepcion-denegado>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <app-footer-admin></app-footer-admin>
  </div>
</div>
