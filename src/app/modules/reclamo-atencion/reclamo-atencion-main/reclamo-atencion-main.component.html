<div id="wrapper">
  <!-- Sidebar -->
  <app-sidebar-admin></app-sidebar-admin>
  <!-- Content Wrapper -->
  <div id="content-wrapper" class="d-flex flex-column">
    <div id="content">
      <!-- Topbar -->
      <app-topbar-admin></app-topbar-admin>
      <!-- Contenido -->
      <div class="container-fluid">
        <!--
        <app-title titulo="Recepción de quejas, reclamos y consultas"></app-title>
        <app-description texto="Bienvenido al módulo para la recepción de quejas, reclamos y consultas."></app-description>
        -->
        <div class="card shadow mb-4">
          <div class="card-header py-3 bg-success">
            <h5 class="m-0 font-weight-bold text-white">Módulo para la atención de reclamos, quejas o sugerencias</h5>
          </div>
          <div class="card-body">
            <div class="row align-items-end">
              <!-- Filtro por Número de Expediente -->
              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Filtro por Número de Expediente:</mat-label>
                  <input
                    matInput
                    [(ngModel)]="filtro.codigoExpediente"
                    placeholder="Ingrese el número de expediente..."
                  />
                </mat-form-field>
              </div>

              <!-- Filtro por Procedencia -->
              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Seleccione Procedencia</mat-label>
                  <mat-select [(ngModel)]="filtro.tipoCanalId">
                    <mat-option *ngFor="let item of tipoProcedencia" [value]="item.id">
                      {{ item.descripcion }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <!-- Filtro por Tipo de Reclamo -->
              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Seleccione Tipo de Reclamo</mat-label>
                  <mat-select [(ngModel)]="filtro.tipoReclamoId">
                    <mat-option *ngFor="let item of tipoReclamos" [value]="item.id">
                      {{ item.descripcion }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="col-md-2">
                <mat-form-field appearance="fill" class="w-100">
                  <mat-label>Seleccione Proyecto</mat-label>
                  <mat-select [(ngModel)]="filtro.tipoProyectoId">
                    <mat-option *ngFor="let item of tipoProyectos" [value]="item.id">
                      {{ item.descripcion }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <!-- Botones -->
              <div class="botones-acciones col-md-4 d-flex justify-content-end gap-2">
                <button class="btn-buscar" (click)="buscarConFiltros()">
                  <i class="bi bi-search"></i> Buscar
                </button>
                <button class="btn-resetear" (click)="limpiarFiltros()">
                  <i class="bi bi-trash"></i> Limpiar
                </button>
                <button class="btn-descargar">
                  <i class="bi bi-download"></i> Descargar
                </button>
              </div>
            </div>
            <nav>
              <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-por-atender" type="button" role="tab" aria-controls="nav-home" aria-selected="true" (click)="activarPestaniaA('pendiente')">
                  <i class="bi-file-earmark-text text-success"></i>
                  Por atender</button>
                <button class="nav-link"
                        id="nav-profile-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#nav-en-proceso"
                        type="button"
                        role="tab"
                        aria-controls="nav-profile"
                        aria-selected="false"
                        (click)="activarPestaniaA('proceso')">
                  <i class="bi bi-arrow-repeat text-danger color-primary icon-bold"></i>
                  En Proceso
                </button>
                <button class="nav-link"
                        id="nav-contact-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#nav-atendido"
                        type="button"
                        role="tab"
                        aria-controls="nav-profile"
                        aria-selected="false"
                        (click)="activarPestaniaA('atendidos')">
                  <i class="bi-check-circle-fill text-primary color-primary"></i>
                  Atendidos
                </button>

                <button class="nav-link"
                        id="nav-reasignado-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#nav-reasignado"
                        type="button"
                        role="tab"
                        aria-controls="nav-contact"
                        aria-selected="false"
                        (click)="activarPestaniaA('reasignado')">
                  <i class="bi-chevron-double-right text-danger color-danger icon-bold"></i>
                  Reasignados
                </button>

              </div>
            </nav>
            <div class="tab-content" id="nav-tabContent">
              <div class="tab-pane fade show active" id="nav-por-atender" role="tabpanel" aria-labelledby="nav-home-tab" tabindex="0">
                <br>
                <app-reclamo-atencion-pendiente #reclamoPendientes (cambiarPestaniaA)="activarPestaniaA($event)"></app-reclamo-atencion-pendiente>
              </div>
              <div class="tab-pane fade" id="nav-en-proceso" role="tabpanel" aria-labelledby="nav-profile-tab" tabindex="0">
                <br>
                <app-reclamo-atencion-proceso #reclamoProceso (cambiarPestaniaA)="activarPestaniaA($event)"></app-reclamo-atencion-proceso>
              </div>
              <div class="tab-pane fade" id="nav-atendido" role="tabpanel" aria-labelledby="nav-contact-tab" tabindex="0">
                <br>
                <app-reclamo-atencion-atendido #reclamoAtendidos (cambiarPestaniaA)="activarPestaniaA($event)"></app-reclamo-atencion-atendido>
              </div>
              <div class="tab-pane fade" id="nav-reasignado" role="tabpanel" aria-labelledby="nav-reasignado-tab" tabindex="0">
                <br>
                <app-reclamo-atencion-reasignado #reclamoReasignado (cambiarPestaniaA)="activarPestaniaA($event)"></app-reclamo-atencion-reasignado>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <app-footer-admin></app-footer-admin>
  </div>
</div>
